[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inec-civic-qa-verifier"
version = "0.1.0"
description = "Multilingual, nonpartisan voter FAQ and INEC link/message verification prototype for Nigeria's 2026/2027 elections."
readme = "README.md"
authors = [{ name = "Civic Tech Team", email = "civictech@example.org" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "tldextract>=5.1.0",
    "rapidfuzz>=3.8.0",
    "jinja2>=3.1.3",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.5.0",
    "rank-bm25>=0.2.2"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "eval_*.py"]
